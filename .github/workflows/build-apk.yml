name: Build APK

on:
  push:
    # Every branch is built so changes are checked; only main publishes a release.
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk MusicTracker-0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MusicTracker-apk
          path: MusicTracker-0.${{ github.run_number }}.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.${{ github.run_number }}
          name: Music Tracker 0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: MusicTracker-0.${{ github.run_number }}.apk

      # Pictures of every screen with sample songs, to check the look without a phone.
      - name: Render screenshots
        run: ./gradlew testDebugUnitTest --tests '*ScreenshotTest*'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/screenshots
          if-no-files-found: ignore
