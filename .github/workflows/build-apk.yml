name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk MusicTracker-0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MusicTracker-apk
          path: MusicTracker-0.${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.${{ github.run_number }}
          name: Music Tracker 0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: MusicTracker-0.${{ github.run_number }}.apk
